name: Build Linux Kernel

on:
  push:
    branches:
      - test_ci

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install make bc u-boot-tools flex bison libssl-dev tar kmod xz-utils gcc-arm-linux-gnueabi -y

    - name: Build the dtb file
      run: |
        export CROSS_COMPILE=arm-linux-gnueabi-
        export ARCH=arm
        make zynq_xcomm_adv7511_defconfig
        make -j6 zynq-coraz7s-ad5592r-s-pmdz.dtb
      shell: bash

    - name: Export dtb file
      uses: actions/upload-artifact@v4
      with:
        name: dtb-file
        path: arch/arm/boot/dts/zynq-coraz7s-ad5592r-s-pmdz.dtb

  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install make bc u-boot-tools flex bison libssl-dev tar kmod xz-utils gcc-arm-linux-gnueabi -y

    - name: Build the kernel file
      id: build-kernel
      run: |
        export CROSS_COMPILE=arm-linux-gnueabi-
        export ARCH=arm
        make zynq_xcomm_adv7511_defconfig
        make -j6 UIMAGE_LOADADDR=0x8000 uImage
      shell: bash

    - name: Export kernel file
      uses: actions/upload-artifact@v4
      with:
        name: kernel-file
        path: arch/arm/boot/uImage

  check-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 20

    - name: Show new commits in the push
      run: |
        echo "New commits pushed to branch:"  
        #git fetch origin ${{ github.event.before }} rezolvarea pentru force push
        commits_list=$(git log ${{ github.event.before }}..${{ github.event.after }} --pretty=format:"%H")
        for commit in $commits_list; do
          git format-patch -1 $commit --stdout | scripts/checkpatch.pl --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict
        done
